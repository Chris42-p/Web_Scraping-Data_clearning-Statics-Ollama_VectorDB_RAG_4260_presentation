<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Document Search</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #ffffff;
      --bg-secondary: #f7f7f5;
      --bg-hover: #f0f0ee;
      --text-primary: #1a1a18;
      --text-secondary: #6b6b67;
      --text-tertiary: #a0a09c;
      --text-info: #185fa5;
      --border: rgba(0, 0, 0, 0.10);
      --border-hover: rgba(0, 0, 0, 0.18);
      --badge-bg: #f0f0ee;
      --badge-text: #5f5e5a;
      --accent: #185fa5;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg-secondary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 2.5rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 620px;
    }

    /* Header */
    .header {
      margin-bottom: 1.5rem;
    }

    .header-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }

    .logo {
      width: 30px;
      height: 30px;
      background: var(--text-primary);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: #fff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h1 {
      font-size: 18px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .subtitle em {
      color: var(--accent);
      font-style: italic;
    }

    /* Search bar */
    .search-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg);
      border: 0.5px solid var(--border-hover);
      border-radius: 8px;
      padding: 0 12px;
      margin-bottom: 1.25rem;
      transition: border-color 0.15s;
    }

    .search-wrap:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(24, 95, 165, 0.08);
    }

    .search-wrap svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      color: var(--text-tertiary);
    }

    .search-wrap input {
      flex: 1;
      border: none;
      outline: none;
      font-family: inherit;
      font-size: 14px;
      padding: 11px 0;
      background: transparent;
      color: var(--text-primary);
    }

    .search-wrap input::placeholder {
      color: var(--text-tertiary);
    }

    .search-wrap button {
      background: none;
      border: none;
      cursor: pointer;
      padding: 5px;
      border-radius: 5px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.12s;
    }

    .search-wrap button:hover {
      background: var(--bg-hover);
    }

    .search-wrap button svg {
      width: 16px;
      height: 16px;
    }

    /* List header */
    .list-header {
      font-size: 13px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    .list-header svg {
      width: 14px;
      height: 14px;
    }

    /* Document list */
    .doc-list {
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .doc-item {
      padding: 14px 16px;
      border-bottom: 0.5px solid var(--border);
      cursor: pointer;
      transition: background 0.12s;
    }

    .doc-item:last-child {
      border-bottom: none;
    }

    .doc-item:hover {
      background: var(--bg-hover);
    }

    .doc-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .doc-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
      flex: 1;
      transition: color 0.12s;
    }

    .doc-item:hover .doc-title {
      color: var(--accent);
    }

    .doc-badge {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 5px;
      background: var(--badge-bg);
      color: var(--badge-text);
      flex-shrink: 0;
    }

    .doc-date {
      font-size: 12px;
      color: var(--text-tertiary);
      display: flex;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
    }

    .doc-date svg {
      width: 12px;
      height: 12px;
    }

    .doc-from {
      font-size: 12px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 4px;
    }

    .doc-from svg {
      width: 12px;
      height: 12px;
    }

    .doc-snippet {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .doc-snippet mark {
      background: none;
      color: var(--text-primary);
      font-weight: 500;
    }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-tertiary);
      font-size: 14px;
    }

    .empty svg {
      width: 28px;
      height: 28px;
      display: block;
      margin: 0 auto 10px;
      opacity: 0.4;
    }

    /* Similarity score badge (shown after search) */
    .score-badge {
      font-size: 11px;
      color: var(--text-tertiary);
      margin-left: auto;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }

    .toolbar button {
      border: 0.5px solid var(--border-hover);
      background: var(--bg);
      color: var(--text-primary);
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
    }

    .toolbar button:hover {
      background: var(--bg-hover);
    }

    .status {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 1rem;
    }

    .status.error {
      color: #a53a3a;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <div class="header-top">
        <div class="logo">
          <!-- brain icon -->
          <svg viewBox="0 0 24 24">
            <path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z" />
            <path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z" />
            <path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4" />
            <path d="M17.599 6.5a3 3 0 0 0 .399-1.375" />
            <path d="M6.003 5.125A3 3 0 0 0 6.401 6.5" />
            <path d="M3.477 10.896a4 4 0 0 1 .585-.396" />
            <path d="M19.938 10.5a4 4 0 0 1 .585.396" />
            <path d="M6 18a4 4 0 0 1-1.967-.516" />
            <path d="M19.967 17.484A4 4 0 0 1 18 18" />
          </svg>
        </div>
        <h1>AI Document Search</h1>
      </div>
      <p class="subtitle">Ask questions about your <em>documents</em> and extract information instantly</p>
    </div>

    <div class="toolbar">
      <button id="loadDocsBtn">Load Documents</button>
      <button id="startSessionBtn">Start Session</button>
      <button id="connectGmailBtn">Connect Gmail</button>
    </div>

    <div class="status" id="statusText">Ready to load documents...</div>

    <div class="search-wrap">
      <!-- search icon -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8" />
        <path d="m21 21-4.3-4.3" />
      </svg>
      <input type="text" id="searchInput" placeholder="Ask anything about your documents..." />
      <button onclick="handleSearch()" title="Search">
        <!-- send icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true">
          <path d="m22 2-7 20-4-9-9-4Z" />
          <path d="M22 2 11 13" />
        </svg>
      </button>
    </div>

    <div class="list-header">
      <!-- files icon -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true">
        <path
          d="M15.5 2H8.6c-.4 0-.8.2-1.1.5-.3.3-.5.7-.5 1.1v12.8c0 .4.2.8.5 1.1.3.3.7.5 1.1.5h9.8c.4 0 .8-.2 1.1-.5.3-.3.5-.7.5-1.1V6.5L15.5 2z" />
        <path d="M3 7.6v12.8c0 .4.2.8.5 1.1.3.3.7.5 1.1.5h9.8" />
        <path d="M15 2v5h5" />
      </svg>
      <span id="listCount">All Documents (0)</span>
    </div>

    <div class="doc-list" id="docList"></div>
  </div>

  <script>
    const API_BASE = "http://127.0.0.1:8000";
    /*const docs = [
      { title: "Q3 Financial Report", type: "PDF", from: "finance@company.com", date: "May 20, 2026", snippet: "This document contains quarterly financial data and projections for the fiscal year ending December 2026." },
      { title: "Engineering Meeting Notes", type: "DOCX", from: "eng-team@company.com", date: "May 18, 2026", snippet: "Discussion on vector database architecture and embedding pipeline design for the AI retrieval system." },
      { title: "Product Roadmap 2026", type: "PPTX", from: "product@company.com", date: "May 15, 2026", snippet: "Strategic product initiatives for H2 2026 including AI-powered search and recommendation features." },
      { title: "Customer Data Export", type: "CSV", from: "data@company.com", date: "May 12, 2026", snippet: "Structured dataset with columns: customer_id, name, plan, revenue, signup_date, last_active." },
      { title: "Partnership Agreement Draft", type: "DOCX", from: "legal@company.com", date: "May 10, 2026", snippet: "Draft terms for the upcoming partnership proposal covering scope, responsibilities, and revenue sharing." },
      { title: "Server Logs Archive", type: "ZIP", from: "ops@company.com", date: "May 8, 2026", snippet: "Compressed archive of server logs from April 2026 including error reports and performance metrics." },
    ];*/
    let docs = [];
    async function loadDocuments() {
      try {
        const res = await fetch('http://localhost:8000/documents');
        const data = await res.json();
        docs = data.documents;
        render(docs, '');
      } catch (e) {
        console.error('Failed to load documents:', e);
        render([], '');
      }
    }

    // Fetch documents from backend
    function setStatus(message, isError = false) {
      const el = document.getElementById("statusText");
      el.textContent = message;
      el.className = isError ? "status error" : "status";
    }

    function escapeHtml(str = "") {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function highlight(text, query) {
      if (!query) return escapeHtml(text);
      const safe = escapeHtml(text);
      const re = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
      return safe.replace(re, '<mark>$1</mark>');
    }

    const calIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>`;
    const userIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 1 0-16 0"/></svg>`;

    // normalize document data from backend to ensure consistent fields for frontend rendering
    function normalizeDoc(doc) {
      const headerText = doc.header_footer || "";
      const fromMatch = headerText.match(/From:\s*(.*)/i);
      const dateMatch = headerText.match(/Date:\s*(.*)/i);

      return {
        title: doc.title || "Untitled document",
        type: detectType(doc),
        from: doc.author || (fromMatch ? fromMatch[1].trim() : "Unknown sender"),
        date: doc.time_creation || (dateMatch ? dateMatch[1].trim() : "Unknown date"),
        snippet: doc.paragraphs || doc.paragaphs || "No preview available"
      };
    }

    // simple heuristic to determine document type based on header content
    function detectType(doc) {
      const header = (doc.header_footer || "").toLowerCase();
      if (header.includes("message-id")) return "EMAIL";
      return "DOC";
    }
    // render document list to UI
    function render(list, query = "") {
      document.getElementById('listCount').textContent = query
        ? `Results for "${query}" (${list.length})`
        : `All Documents (${list.length})`;

      const el = document.getElementById('docList');
      if (!list.length) {
        el.innerHTML = `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>No documents found</div>`;
        return;
      }
      el.innerHTML = list.map(d => `
        <div class="doc-item">
          <div class="doc-meta">
            <span class="doc-title">${highlight(d.title, query)}</span>
            <span class="doc-badge">${d.type}</span>
            <span class="doc-date">${calIcon} ${d.date}</span>
          </div>
          <div class="doc-from">${userIcon} ${escapeHtml(d.from)}</div>
          <div class="doc-snippet">${highlight(d.snippet, query)}</div>
        </div>
      `).join('');
    }

    // load documents from backend
    async function loadDocuments() {
      setStatus("Loading documents...");
      try {
        const response = await fetch(`${API_BASE}/documents`, {
          method: "GET",
          credentials: "include"
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        const rawDocs = Array.isArray(data.documents) ? data.documents : [];
        docs = rawDocs.map(normalizeDoc);
        render(docs, "");
        setStatus(`Loaded ${docs.length} documents.`);
      } catch (error) {
        console.error(error);
        setStatus(`Failed to load documents: ${error.message}`, true);
        render([], "");
      }
    }

    // start session (initialize backend resources, vector DB, etc.)
    async function startSession() {
      setStatus("Starting session...");
      try {
        const response = await fetch(`${API_BASE}/session/start`, {
          method: "GET",
          credentials: "include"
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        setStatus(data.message || "Session started.");
      } catch (error) {
        console.error(error);
        setStatus(`Failed to start session: ${error.message}`, true);
      }
    }

    // connect to Gmail (OAuth flow)
    function connectGmail() {
      window.location.href = `${API_BASE}/auth/google/login`;
    }

    function handleSearch() {
      const q = document.getElementById('searchInput').value.trim();
      if (!q) { render(docs, ''); return; }
      const ql = q.toLowerCase();
      const filtered = docs.filter(d =>
        d.title.toLowerCase().includes(ql) ||
        d.snippet.toLowerCase().includes(ql) ||
        d.type.toLowerCase().includes(ql)
      );
      render(filtered, q);
    }

    document.getElementById('searchInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') handleSearch();
    });

    document.getElementById("loadDocsBtn").addEventListener("click", loadDocuments);
    document.getElementById("startSessionBtn").addEventListener("click", startSession);
    document.getElementById("connectGmailBtn").addEventListener("click", connectGmail);

    loadDocuments();
  </script>
</body>

</html>

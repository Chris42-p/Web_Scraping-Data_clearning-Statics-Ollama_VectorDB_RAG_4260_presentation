version: '3.8'
services:
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  app:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ../__ingest_file:/app/__ingest_file
      - ../__processed_file:/app/__processed_file

  backend:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
    command: uvicorn Modules.user_GUI.back_end.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - ollama
    volumes:
      - ../__ingest_file:/app/__ingest_file

volumes:
  ollama_data:
